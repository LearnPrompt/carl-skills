html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:13px}
.sub{color:var(--muted);font-size:13px;line-height:1.55}
h1{font-size:26px;font-weight:700;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;line-height:1.4;margin:0}
h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0 0 12px;text-transform:uppercase}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-top:16px}
.card h2{margin-bottom:8px}

/* top bar */
.bar{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.bar .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding:14px 0}
.bar .brand{font-weight:700;font-size:15px;margin-right:auto}
.bar .cell{display:flex;gap:6px;align-items:baseline;min-width:0;max-width:100%}
.bar .k{color:var(--muted);font-size:12px;white-space:nowrap}
.bar .v{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .v.mono{font-size:12px}
.serve-line{border-top:1px solid var(--line-soft);padding:6px 0;font-size:12px;color:var(--muted)}

.intro{padding:28px 0 0}
.lede{margin:0;color:var(--muted)}

/* overview grid */
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:stretch}
.grid2>.card{margin-top:16px}
.mess{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mess .big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mess .big small{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;line-height:20px;vertical-align:middle}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.yellow{background:var(--yellow-bg);color:var(--yellow)}
.pill.red{background:var(--red-bg);color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0}
.chips span{font-size:12px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.segbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:14px 0 10px}
.seg{height:100%;flex:none}
.seg.green{background:var(--green)}
.seg.yellow{background:var(--yellow)}
.seg.red{background:var(--red)}
.seg.other{background:var(--other)}
.seg.free{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px;background:var(--other)}
.dot.green{background:var(--green)}
.dot.yellow{background:var(--yellow)}
.dot.red{background:var(--red)}
.line{margin:12px 0 0;font-size:15px}
.advice ol{margin:0;padding-left:20px}
.advice li{margin:6px 0}
.advice .tools{margin-top:12px}
.longterm ul{margin:0;padding-left:20px}
.longterm li{margin:6px 0}
.notes p{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* disks */
.disk{padding:12px 0;border-top:1px solid var(--line-soft)}
.disk:first-of-type{border-top:0;padding-top:0}
.disk .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.disk .name{font-weight:600}
.disk .segbar{margin:10px 0 8px}
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 20px}
.sys .k{display:block;color:var(--muted);font-size:12px}
.sys .v{display:block;font-size:14px;overflow-wrap:anywhere}

/* top5 table */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.size{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
td.c{width:24px;padding-right:0}

/* sections */
.sec{margin-top:32px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:0 4px 10px}
.sec-head .count{color:var(--muted);font-weight:500;margin-left:8px;font-size:15px}
.sec-head p{margin:2px 0 0}
.sec-tools{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.sec-tools .switch{font-size:13px;color:var(--muted);white-space:nowrap}
.sec[data-color=green] .sec-head h2 .dot{background:var(--green)}
.sec[data-color=yellow] .sec-head h2 .dot{background:var(--yellow)}
.sec[data-color=red] .sec-head h2 .dot{background:var(--red)}
.empty{padding:16px 24px;margin:0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.subhead{margin:18px 0 6px;padding:0 4px}
.subhead:first-child{margin-top:4px}
.subhead .n{margin-left:8px;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}

/* combined page: the after picture */
.preview-wrap{margin-top:32px}
.preview-wrap .sec-head{padding-bottom:10px}
.preview-wrap .cfo-preview{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.overview .block{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}

/* item cards */
.item{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--other)}
.item[data-color=green]::before{background:var(--green)}
.item[data-color=yellow]::before{background:var(--yellow)}
.item[data-color=red]::before{background:var(--red)}
.item-head{display:flex;align-items:center;gap:12px;padding:14px 18px 14px 20px;cursor:pointer;user-select:none}
.item-head .pick{flex:none;display:flex;align-items:center}
.item-head .title{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.item-head .name{font-weight:600;overflow-wrap:anywhere}
.item-head .size{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.item-head .gn-status{white-space:nowrap;font-size:13px;color:var(--muted);min-width:0}
.item.done .gn-status{color:var(--green)}
.item.failed .gn-status{color:var(--red);font-weight:600}
.item.working .gn-status{color:var(--muted)}
.item.done .name{color:var(--muted);text-decoration:line-through}
.chev{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);position:relative;background:transparent}
.chev::after{content:"";position:absolute;left:6px;top:4px;width:5px;height:5px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.item.open .chev::after{transform:rotate(225deg);top:7px}
.badge{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;line-height:20px;font-weight:500;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.badge.dest{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge.red{background:var(--red-bg);color:var(--red)}
.item-body{display:none;padding:0 18px 16px 20px;border-top:1px solid var(--line-soft)}
.item.open .item-body{display:block}
.item-body .path{margin:12px 0 0;color:var(--muted);overflow-wrap:anywhere}
.item-body dl{display:grid;grid-template-columns:minmax(88px,auto) 1fr;gap:6px 14px;margin:12px 0 0}
.item-body dt{color:var(--muted);font-size:13px;white-space:nowrap}
.item-body dd{margin:0}
.item-body .sub+.sub{margin-top:2px}
.members{list-style:none;margin:12px 0 0;padding:0}
.members li{padding:6px 0;border-top:1px solid var(--line-soft);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.members li:first-child{border-top:0}
.members .mono{color:var(--muted)}
.cmd{position:relative;margin:10px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 84px 10px 12px;font-family:var(--mono);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.cmd code{font:inherit}
.cmd .copy{position:absolute;right:8px;top:7px}
.controls{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.choice{white-space:nowrap;font-size:14px}
.choice.needs-permanent{color:var(--red)}
body[data-permanent="off"] .needs-permanent{display:none}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);width:16px;height:16px;margin:0 6px 0 0;vertical-align:-3px;cursor:pointer}
select.gn-dest{height:34px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card);color:var(--ink);padding:0 10px;max-width:100%;font:inherit;font-size:13px;font-family:var(--mono)}

/* buttons */
.btn{height:36px;padding:0 16px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#ffffff}
.btn.primary:hover{background:#000000}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.btn:disabled,.btn.primary:disabled{background:var(--bg);border-color:var(--line);color:var(--muted);cursor:not-allowed}

/* footer */
.foot{position:sticky;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.2) blur(8px);border-top:1px solid var(--line);margin-top:32px}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 0}
.foot-buttons{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
#gn-count{font-weight:600}
.colophon{padding:24px 0 40px;color:var(--muted);font-size:12px;text-align:center}

@media (max-width:860px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:0 14px}.card{padding:16px}.mess .big{font-size:44px}.sec-head,.foot-row{flex-direction:column;align-items:stretch}.item-head{flex-wrap:wrap}.item-body dl{grid-template-columns:1fr}.item-body dt{margin-top:6px}}
@media print{
  .btn,.foot-buttons,.sec-tools,.switch,.chev,.controls,.serve-line,.preview-wrap{display:none!important}
  .bar,.foot{position:static;background:#fff;backdrop-filter:none}
  .item .item-body{display:block}
  .card,.item,.empty{box-shadow:none;border:1px solid var(--line)}
  body{font-size:12px;background:#fff}
}
</style>
</head>
<body data-kind="__REPORT_KIND__" data-mode="__REPORT_MODE__" data-permanent="off">
__REPORT_BODY__
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script id="report-config" type="application/json">__REPORT_CONFIG__</script>
<script>
(function () {
  function readJson(id) { return JSON.parse(document.getElementById(id).textContent); }
  var config = readJson('report-config');
  var texts = readJson('report-text');
  window.GN = {
    config: config,
    data: readJson('report-data'),
    text: texts[config.lang] || texts.zh,
    token: config.token || '',
    busy: false
  };
  var D = window.GN.data;
  // One page shape, three payloads: a bare plan, a bare analysis, or the
  // combined envelope that carries both halves under their own keys.
  window.GN.planDoc = D.plan || (D.actions ? D : null);
  window.GN.analysisDoc = D.analysis || (D.items ? D : null);
  window.GN.plan = window.GN.planDoc || D;
})();
</script>
<script>
(function () {
  var GN = window.GN, C = GN.config, T = GN.text, D = GN.data;
  var KIND = C.kind, MODE = C.mode;
  var PLAN = GN.planDoc, ANALYSIS = GN.analysisDoc;
  var byId = {};
  ((PLAN && PLAN.actions) || []).forEach(function (a) { byId[a.id] = a; });
  ((ANALYSIS && ANALYSIS.items) || []).forEach(function (a) { byId[a.id] = a; });
  var permanentOn = false;
  var executed = {};
  var touched = false;

  function $(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function fmt(tpl, vars) { return String(tpl).replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; }); }
  function fmtBytes(n) {
    var size = Number(n) || 0, units = ['B', 'KB', 'MB', 'GB', 'TB'];
    for (var i = 0; i < units.length; i++) {
      if (size < 1024 || i === units.length - 1) return (i === 0 ? Math.round(size) : size.toFixed(1)) + ' ' + units[i];
      size /= 1024;
    }
    return size.toFixed(1) + ' TB';
  }
  function hasId(el, id) { return (' ' + (el.dataset.ids || '') + ' ').indexOf(' ' + id + ' ') >= 0; }
  function elementsFor(id) { return $('[data-ids]').filter(function (el) { return hasId(el, id); }); }
  function message(text) { var el = document.getElementById('gn-message'); if (el) el.textContent = text || ''; }

  /* ---- selection ---- */
  function chosenFor(cb) {
    var chosen = document.querySelector('input.gn-choice[name="' + cb.dataset.choice + '"]:checked');
    return chosen && !chosen.disabled ? chosen : null;
  }
  function selection(root) {
    var ids = [];
    $('input.gn-pick:checked', root).forEach(function (cb) {
      if (cb.disabled) return;
      if (cb.dataset.actionId) { ids.push(cb.dataset.actionId); return; }
      if (cb.dataset.itemId) {
        var pick = chosenFor(cb);
        ids.push({ id: cb.dataset.itemId, action: pick ? pick.dataset.action : 'trash' });
        return;
      }
      var chosen = chosenFor(cb);
      if (chosen) ids.push(chosen.value);
    });
    $('input.gn-adopt:checked', root).forEach(function (cb) {
      if (cb.disabled) return;
      var block = cb.closest('[data-group-id]');
      var opt = block ? block.querySelector('input.gn-option:checked') : null;
      if (opt && !opt.disabled) opt.dataset.actionIds.split(' ').forEach(function (id) { if (id && ids.indexOf(id) < 0) ids.push(id); });
    });
    return ids.filter(function (entry) { var id = typeof entry === 'string' ? entry : entry.id; return !executed[id]; });
  }
  function overrides() {
    var out = [];
    $('select.gn-dest').forEach(function (sel) {
      if (sel.disabled) return;
      if (sel.value !== sel.dataset.original) out.push({ action_id: sel.dataset.actionId, destination_key: sel.value });
    });
    return out;
  }
  function tally(ids) {
    var t = { move: 0, trash: 0, delete: 0, bytes: 0 };
    ids.forEach(function (entry) {
      var id = typeof entry === 'string' ? entry : entry.id;
      var a = byId[id]; if (!a) return;
      var kind = typeof entry === 'string' ? a.kind : entry.action;
      t[kind] = (t[kind] || 0) + 1;
      t.bytes += Number(typeof entry === 'string' ? a.reclaims_bytes : a.size_bytes) || 0;
    });
    return t;
  }
  /* Tell the after picture what is ticked right now.  It stays quiet until the
     first real interaction, so the page still opens on the full after state. */
  function announce(ids) {
    if (!touched && !ids.length) return;
    if (typeof window.CustomEvent !== 'function') return;
    var detail = { action_ids: [], item_ids: [] };
    ids.forEach(function (e) { if (typeof e === 'string') detail.action_ids.push(e); else detail.item_ids.push(e.id); });
    window.dispatchEvent(new CustomEvent('cfo:selection', { detail: detail }));
  }
  function split(ids) {
    var out = { actions: [], items: [] };
    ids.forEach(function (e) { if (typeof e === 'string') out.actions.push(e); else out.items.push(e); });
    return out;
  }
  function refresh() {
    var ids = selection();
    var t = tally(ids);
    var count = document.getElementById('gn-count');
    if (count) count.textContent = KIND === 'storage'
      ? fmt(T.footer_count_storage, { trash: t.trash, delete: t.delete, bytes: fmtBytes(t.bytes) })
      : fmt(T.footer_count, { moves: t.move, trash: t.trash, delete: t.delete, bytes: fmtBytes(t.bytes) });
    announce(ids);
    if (GN.busy) return;
    ['gn-main', 'gn-dry'].forEach(function (id) { var b = document.getElementById(id); if (b) b.disabled = ids.length === 0; });
  }

  /* ---- permanent delete gate ---- */
  function fallbackChoice(input) {
    var group = $('input[name="' + input.name + '"]');
    var def = group.filter(function (i) { return i.dataset.default === '1' && !i.disabled; })[0]
      || group.filter(function (i) { return !i.disabled && i !== input; })[0];
    input.checked = false;
    if (def) def.checked = true;
  }
  function applyPermanent() {
    document.body.dataset.permanent = permanentOn ? 'on' : 'off';
    $('.needs-permanent input').forEach(function (inp) {
      if (inp.dataset.executed === '1') return;
      inp.disabled = !permanentOn;
      if (!permanentOn && inp.checked) fallbackChoice(inp);
    });
    refresh();
  }

  /* ---- status ---- */
  function disableInputs(el) {
    $('input, select', el).forEach(function (inp) {
      if (inp.type === 'checkbox') inp.checked = false;
      inp.disabled = true;
      inp.dataset.executed = '1';
    });
    $('button[data-action="trash"], button[data-action="delete"]', el).forEach(function (b) { b.disabled = true; });
  }
  function setStatus(id, cls, text) {
    elementsFor(id).forEach(function (el) {
      el.classList.remove('working', 'done', 'failed');
      if (cls) el.classList.add(cls);
      var cell = el.querySelector('.gn-status');
      if (cell) cell.textContent = text;
      if (cls === 'done') disableInputs(el);
    });
  }
  function markResults(results) {
    (results || []).forEach(function (r) {
      var id = r.action_id || r.item_id;
      var st = r.status;
      var tail = r.detail ? ' · ' + r.detail : '';
      if (st === 'moved' || st === 'trashed' || st === 'deleted') {
        executed[id] = true;
        setStatus(id, 'done', T['status_' + st] || T.status_done);
      } else if (st === 'dry-run') {
        setStatus(id, '', T.status_dry + tail);
      } else if (st === 'skipped' || st === 'refused') {
        setStatus(id, 'failed', (T['status_' + st] || T.status_failed) + tail);
      } else {
        setStatus(id, 'failed', T.status_failed + tail);
      }
    });
    refresh();
  }
  function markExecuted(ids) {
    (ids || []).forEach(function (id) {
      executed[id] = true;
      var a = byId[id] || {};
      var key = a.kind === 'move' ? 'status_moved' : a.kind === 'trash' ? 'status_trashed' : a.kind === 'delete' ? 'status_deleted' : 'status_done';
      setStatus(id, 'done', T[key]);
    });
    refresh();
  }

  /* ---- clipboard ---- */
  function copyText(text, btn) {
    function done() { var old = btn.textContent; btn.textContent = T.copied; setTimeout(function () { btn.textContent = old; }, 1200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacy(); });
    } else { legacy(); }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  /* ---- reveal (serve only) ---- */
  function headers() { return { 'Content-Type': 'application/json', 'X-GN-Token': GN.token || '' }; }
  function reveal(path, btn) {
    if (MODE !== 'serve') return;
    fetch('/api/reveal', { method: 'POST', headers: headers(), body: JSON.stringify({ path_portable: path }) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); message(T.reveal_done); })
      .catch(function () { message(T.network_failed); });
  }

  /* ---- events ---- */
  document.addEventListener('change', function (e) {
    var el = e.target;
    touched = true;
    if (el.matches && el.matches('input[data-kind="delete"]') && el.checked) {
      if (!confirm(fmt(T.confirm_delete, { path: el.dataset.path || '', size: el.dataset.size || '' }))) fallbackChoice(el);
    }
    if (el.id === 'gn-permanent') { permanentOn = el.checked; applyPermanent(); return; }
    refresh();
  });
  document.addEventListener('click', function (e) {
    var t = e.target;
    var btn = t.closest ? t.closest('button') : null;
    if (btn) {
      if (btn.classList.contains('gn-toggle-all')) {
        var sec = btn.closest('section');
        var boxes = $('input.gn-pick, input.gn-adopt', sec).filter(function (b) { return !b.disabled; });
        var turnOn = boxes.some(function (b) { return !b.checked; });
        boxes.forEach(function (b) { b.checked = turnOn; });
        btn.textContent = turnOn ? btn.dataset.off : btn.dataset.on;
        touched = true;
        refresh();
        return;
      }
      if (btn.classList.contains('gn-fold-all')) {
        var s2 = btn.closest('section');
        var items = $('.item', s2);
        var open = items.some(function (i) { return !i.classList.contains('open'); });
        items.forEach(function (i) { i.classList.toggle('open', open); });
        btn.textContent = open ? btn.dataset.off : btn.dataset.on;
        return;
      }
      if (btn.id === 'gn-pick-green') {
        var g = document.querySelector('section.sec[data-color="green"]');
        if (g) {
          $('input.gn-pick, input.gn-adopt', g).forEach(function (b) { if (!b.disabled) b.checked = true; });
          g.scrollIntoView({ behavior: 'smooth', block: 'start' });
          touched = true;
          refresh();
        }
        return;
      }
      if (btn.dataset.action === 'copy') {
        var block = btn.closest('.cmd');
        var code = block ? block.querySelector('code') : null;
        if (code) copyText(code.textContent, btn);
        return;
      }
      if (btn.dataset.action === 'reveal') { reveal(btn.dataset.path || '', btn); return; }
    }
    var head = t.closest ? t.closest('.item-head') : null;
    if (head && !(t.closest('input, button, select, label, a'))) {
      head.parentNode.classList.toggle('open');
    }
  });

  GN.api = { $: $, fmt: fmt, fmtBytes: fmtBytes, selection: selection, overrides: overrides, tally: tally, refresh: refresh, message: message, markResults: markResults, markExecuted: markExecuted, setStatus: setStatus, headers: headers, byId: byId, split: split };
  applyPermanent();
  markExecuted(D.executed_ids || []);
})();
</script>
<script>
(function () {
  var GN = window.GN, A = GN.api, T = GN.text, C = GN.config, D = GN.data;
  var main = document.getElementById('gn-main');
  if (!main) return;

  function download(name, payload) {
    var blob = new Blob([JSON.stringify(payload, null, 2) + '\n'], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url; link.download = name;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  if (C.mode === 'static') {
    main.addEventListener('click', function () {
      var ids = A.selection();
      if (!ids.length) { alert(T.nothing_selected); return; }
      if (C.kind === 'combined') {
        /* One file for both halves: the tidy-up ids under plan, the cleanup ids
           under storage, and each half's source document alongside them so
           apply needs nothing but this file. */
        var parts = A.split(ids);
        var storageActions = {};
        parts.items.forEach(function (e) { storageActions[e.id] = e.action; });
        var payload = {
          schema: 'carl-file-organizer/decisions',
          schema_version: 1,
          decided_at: new Date().toISOString(),
          decided_by: 'html-static',
          plan: { approved_action_ids: parts.actions, overrides: A.overrides() },
          storage: { item_ids: parts.items.map(function (e) { return e.id; }), actions: storageActions }
        };
        if (GN.planDoc) payload.plan.document = GN.planDoc;
        if (GN.analysisDoc) payload.storage.document = GN.analysisDoc;
        download('carl-file-organizer-decisions.json', payload);
        A.message(T.exported_all);
        return;
      }
      if (C.kind === 'storage') {
        var actions = {};
        ids.forEach(function (e) { actions[e.id] = e.action; });
        download('carl-file-organizer-decisions.json', {
          schema: 'carl-file-organizer/storage-decisions',
          schema_version: 1,
          source: D.schema || '',
          item_ids: ids.map(function (e) { return e.id; }),
          actions: actions,
          decided_at: new Date().toISOString(),
          decided_by: 'html-static'
        });
        A.message(T.exported_decisions);
        return;
      }
      var approved = {};
      Object.keys(D).forEach(function (k) { if (k !== 'executed_ids') approved[k] = D[k]; });
      approved.approved_action_ids = ids;
      approved.overrides = A.overrides();
      approved.approved_at = new Date().toISOString();
      approved.approved_by = 'html-static';
      download('carl-file-organizer-approved.json', approved);
      A.message(T.exported_note);
    });
    return;
  }

  /* serve mode */
  (function () {
    var m = location.search.match(/[?&]t=([^&]+)/);
    if (m && !GN.token) GN.token = decodeURIComponent(m[1]);
    if (location.search && window.history && history.replaceState) history.replaceState(null, '', location.pathname);
  })();
  function busy(on) {
    GN.busy = on;
    ['gn-main', 'gn-dry'].forEach(function (id) { var b = document.getElementById(id); if (b) b.disabled = on; });
    A.$('.gn-section-run').forEach(function (b) { b.disabled = on; });
    A.refresh();
  }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: A.headers(), body: JSON.stringify(body) })
      .then(function (r) { return r.text().then(function (text) { var j = {}; try { j = JSON.parse(text); } catch (e) { j = { error: text }; } return { status: r.status, body: j }; }); });
  }
  function idsOf(entries) { return entries.map(function (e) { return typeof e === 'string' ? e : e.id; }); }
  function failAll(entries, detail) {
    idsOf(entries).forEach(function (id) { A.setStatus(id, 'failed', T.status_failed); });
    if (detail) A.message(detail);
  }
  function handle(entries, res) {
    if (res.status !== 200) {
      failAll(entries, A.fmt(T.request_failed, { status: res.status, detail: res.body.error || '' }));
      return;
    }
    A.markResults(res.body.results || []);
    if (res.body.error) A.message(res.body.error);
  }
  function submitOrganize(ids, dryRun) {
    if (!ids.length) { alert(T.nothing_selected); return; }
    var t = A.tally(ids);
    var text = dryRun ? A.fmt(T.confirm_dry, { n: ids.length })
      : A.fmt(T.confirm_apply, { moves: t.move, trash: t.trash, delete: t.delete, bytes: A.fmtBytes(t.bytes) });
    if (!confirm(text)) return;
    A.message('');
    ids.forEach(function (id) { A.setStatus(id, 'working', T.status_working); });
    busy(true);
    post('/api/apply', { action_ids: ids, overrides: A.overrides(), dry_run: !!dryRun })
      .then(function (res) { handle(ids, res); })
      .catch(function () { failAll(ids, T.network_failed); })
      .then(function () { busy(false); });
  }
  function disposeChain(entries) {
    var buckets = { trash: [], delete: [] };
    entries.forEach(function (e) { (buckets[e.action] || buckets.trash).push(e.id); });
    var chain = Promise.resolve();
    ['trash', 'delete'].forEach(function (action) {
      if (!buckets[action].length) return;
      chain = chain.then(function () {
        return post('/api/dispose', { item_ids: buckets[action], action: action })
          .then(function (res) { handle(buckets[action], res); })
          .catch(function () { failAll(buckets[action], T.network_failed); });
      });
    });
    return chain;
  }
  function submitStorage(entries) {
    if (!entries.length) { alert(T.nothing_selected); return; }
    var t = A.tally(entries);
    if (!confirm(A.fmt(T.confirm_dispose, { trash: t.trash, delete: t.delete, bytes: A.fmtBytes(t.bytes) }))) return;
    A.message('');
    idsOf(entries).forEach(function (id) { A.setStatus(id, 'working', T.status_working); });
    busy(true);
    disposeChain(entries).then(function () { busy(false); });
  }
  /* One button, two engines: the moves go through /api/apply first so nothing
     is cleared out from under a file that was about to be filed, then the
     cleanup goes through /api/dispose, trash before permanent delete. */
  function submitCombined(entries, dryRun) {
    if (!entries.length) { alert(T.nothing_selected); return; }
    var parts = A.split(entries);
    var t = A.tally(entries);
    var text = dryRun ? A.fmt(T.confirm_dry, { n: entries.length })
      : A.fmt(T.confirm_apply, { moves: t.move, trash: t.trash, delete: t.delete, bytes: A.fmtBytes(t.bytes) });
    if (!confirm(text)) return;
    A.message('');
    idsOf(entries).forEach(function (id) { A.setStatus(id, 'working', T.status_working); });
    busy(true);
    var chain = Promise.resolve();
    if (parts.actions.length) {
      chain = chain.then(function () {
        return post('/api/apply', { action_ids: parts.actions, overrides: A.overrides(), dry_run: !!dryRun })
          .then(function (res) { handle(parts.actions, res); })
          .catch(function () { failAll(parts.actions, T.network_failed); });
      });
    }
    if (parts.items.length) {
      if (dryRun) {
        chain = chain.then(function () {
          idsOf(parts.items).forEach(function (id) { A.setStatus(id, '', T.status_dry); });
        });
      } else {
        chain = chain.then(function () { return disposeChain(parts.items); });
      }
    }
    chain.then(function () { busy(false); });
  }
  function submit(root, dryRun) {
    var sel = A.selection(root);
    if (C.kind === 'combined') submitCombined(sel, dryRun);
    else if (C.kind === 'storage') submitStorage(sel);
    else submitOrganize(sel, dryRun);
  }
  main.addEventListener('click', function () { submit(null, false); });
  var dry = document.getElementById('gn-dry');
  if (dry) dry.addEventListener('click', function () { submit(null, true); });
  var stop = document.getElementById('gn-shutdown');
  if (stop) stop.addEventListener('click', function () {
    if (!confirm(T.confirm_shutdown)) return;
    fetch('/api/shutdown', { method: 'POST', headers: A.headers(), body: '{}' })
      .then(function () { A.message(T.network_failed); }, function () { A.message(T.network_failed); });
  });
  A.$('.gn-section-run').forEach(function (btn) {
    btn.addEventListener('click', function () { submit(btn.closest('section'), false); });
  });
  if (C.kind === 'organize' || C.kind === 'combined') {
    fetch('/api/plan', { headers: A.headers() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (plan) {
        if (!plan) return;
        if (plan.executed_ids) A.markExecuted(plan.executed_ids);
        var caps = plan.capabilities || {};
        var toggle = document.getElementById('gn-permanent');
        if (toggle && caps.permanent_delete_enabled === false) { toggle.checked = false; toggle.disabled = true; }
      })
      .catch(function () {});
  }
})();
</script>
</body>
